name: Publish lightweight LRC container

on:
  push:
    branches:
      - feature/lrc-line-timing-import
    paths:
      - "Dockerfile.lrc"
      - "requirements-lrc.txt"
      - "docker-compose.yml"
      - ".dockerignore"
      - "frontend/**"
      - "karaoke_gen/**"
      - ".github/workflows/publish-lrc-container.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-lrc-container
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and publish to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.lrc
          push: true
          tags: |
            ghcr.io/markwasley/karaoke-gen:lrc
            ghcr.io/markwasley/karaoke-gen:lrc-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
